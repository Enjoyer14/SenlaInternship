services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    environment: { ZOOKEEPER_CLIENT_PORT: 2181, ZOOKEEPER_TICK_TIME: 2000 }
    healthcheck: { test: ["CMD", "bash", "-c", "nc -z localhost 2181"], interval: 10s, timeout: 5s, retries: 10 }
  kafka1:
    image: confluentinc/cp-kafka:7.7.1
    depends_on: { zookeeper: { condition: service_healthy } }
    ports: ["9092:9092"]
    environment: &kafka-env
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_MS: 300000
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 30000
      KAFKA_LOG_SEGMENT_BYTES: 1048576
      KAFKA_LOG_SEGMENT_MS: 60000
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://localhost:9092
  kafka2:
    image: confluentinc/cp-kafka:7.7.1
    depends_on: { zookeeper: { condition: service_healthy } }
    ports: ["9093:9093"]
    environment: { KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181, KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT", KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL, KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3, KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3, KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2, KAFKA_MIN_INSYNC_REPLICAS: 2, KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false", KAFKA_LOG_RETENTION_MS: 300000, KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 30000, KAFKA_LOG_SEGMENT_BYTES: 1048576, KAFKA_LOG_SEGMENT_MS: 60000, KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0, KAFKA_BROKER_ID: 2, KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093", KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka2:29092,EXTERNAL://localhost:9093" }
  kafka3:
    image: confluentinc/cp-kafka:7.7.1
    depends_on: { zookeeper: { condition: service_healthy } }
    ports: ["9094:9094"]
    environment: { KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181, KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT", KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL, KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3, KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3, KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2, KAFKA_MIN_INSYNC_REPLICAS: 2, KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false", KAFKA_LOG_RETENTION_MS: 300000, KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 30000, KAFKA_LOG_SEGMENT_BYTES: 1048576, KAFKA_LOG_SEGMENT_MS: 60000, KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0, KAFKA_BROKER_ID: 3, KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094", KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka3:29092,EXTERNAL://localhost:9094" }
  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    depends_on: { kafka1: { condition: service_started }, kafka2: { condition: service_started }, kafka3: { condition: service_started } }
    entrypoint: ["/bin/bash", "-c"]
    command: ["cub kafka-ready -b kafka1:29092 3 60 && kafka-topics --bootstrap-server kafka1:29092 --create --if-not-exists --topic bank-transfers --partitions 3 --replication-factor 3 --config min.insync.replicas=2 --config retention.ms=300000"]
    restart: "no"
  db:
    image: postgres:17
    environment: { POSTGRES_DB: bank, POSTGRES_USER: bank, POSTGRES_PASSWORD: bank }
    ports: ["5433:5432"]
    volumes: [bank-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U bank -d bank"], interval: 5s, timeout: 5s, retries: 20 }
  producer:
    build: .
    environment: { APP_ROLE: producer, KAFKA_BOOTSTRAP_SERVERS: "kafka1:29092,kafka2:29092,kafka3:29092", DB_URL: "jdbc:postgresql://db:5432/bank", DB_USER: bank, DB_PASSWORD: bank }
    depends_on: { db: { condition: service_healthy }, kafka-init: { condition: service_completed_successfully } }
  consumer:
    build: .
    environment: { APP_ROLE: consumer, KAFKA_BOOTSTRAP_SERVERS: "kafka1:29092,kafka2:29092,kafka3:29092", DB_URL: "jdbc:postgresql://db:5432/bank", DB_USER: bank, DB_PASSWORD: bank }
    depends_on: { db: { condition: service_healthy }, kafka-init: { condition: service_completed_successfully } }
    deploy: { replicas: 3 }
    restart: unless-stopped
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on: [kafka1, kafka2, kafka3]
    ports: ["8081:8080"]
    environment: { KAFKA_CLUSTERS_0_NAME: bank, KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka1:29092,kafka2:29092,kafka3:29092", KAFKA_CLUSTERS_0_ZOOKEEPER: "zookeeper:2181" }
volumes:
  bank-data:

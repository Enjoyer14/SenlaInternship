spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/bank}
    username: ${DB_USER:bank}
    password: ${DB_PASSWORD:bank}
  jpa:
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

app:
  role: ${APP_ROLE:producer}
  topic: bank-transfers
